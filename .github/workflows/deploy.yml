name: Rich Tutor CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rich-tutor-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax
        run: python -m py_compile app.py

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -v

      - name: Basic secret scan
        shell: bash
        run: |
          if git grep -nEi \
            '(BEGIN (RSA |OPENSSH )?PRIVATE KEY|aws_secret_access_key|api[_-]?key[[:space:]]*=[[:space:]]*["'\''][^"'\'']+|password[[:space:]]*=[[:space:]]*["'\''][^"'\'']+)' \
            -- .               ':!.github/**'               ':!tests/**'               ':!*.md'               ':!*.txt'               ':!.env.example'; then
            echo "Potential secret detected."
            exit 1
          fi

      - name: Docker build
        run: docker build -t rich-tutor-ci .

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Install SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.RICH_TUTOR_SSH_PRIVATE_KEY }}
          PROD_HOST: ${{ secrets.RICH_TUTOR_PROD_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/rich_tutor_deploy
          chmod 600 ~/.ssh/rich_tutor_deploy
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts

      - name: Sync application
        shell: bash
        env:
          PROD_HOST: ${{ secrets.RICH_TUTOR_PROD_HOST }}
          PROD_USER: ${{ secrets.RICH_TUTOR_PROD_USER }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/rich_tutor_deploy -o IdentitiesOnly=yes" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude 'data/' \
            --exclude 'backups/' \
            --exclude '.venv/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            ./ "${PROD_USER}@${PROD_HOST}:/home/ubuntu/rich-tutor/"

      - name: Deploy with richdeploy
        shell: bash
        env:
          PROD_HOST: ${{ secrets.RICH_TUTOR_PROD_HOST }}
          PROD_USER: ${{ secrets.RICH_TUTOR_PROD_USER }}
        run: |
          ssh -i ~/.ssh/rich_tutor_deploy -o IdentitiesOnly=yes \
            "${PROD_USER}@${PROD_HOST}" \
            'richdeploy tutor'

      - name: Verify public health
        run: |
          for i in $(seq 1 20); do
            if curl -fsS https://tutor.richmackos.com/health; then
              exit 0
            fi
            sleep 3
          done
          exit 1
