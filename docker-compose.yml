services:
  rich-tutor:
    build: .
    container_name: rich-tutor
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:5085:5085"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5085/health', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
