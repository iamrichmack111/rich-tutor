
{% extends "base.html" %}{% block title %}Change Password • Rich Tutor{% endblock %}
{% block content %}
<div class="auth-wrap"><section class="panel auth-card">
<p class="eyebrow">ACCOUNT SECURITY</p><h1>Change your password</h1>
<p class="muted">Your account requires a new password before you can continue.</p>
{% if error %}<div class="feedback bad">{{error}}</div>{% endif %}
<form method="post" class="stack-form">
<label>Current password<input type="password" name="current_password" required></label>
<label>New password<input type="password" name="new_password" required></label>
<label>Confirm new password<input type="password" name="confirm_password" required></label>
<button class="primary">Save new password</button>
</form>
</section></div>
{% endblock %}
